services:
  redis:
    image: redis:7-alpine
    container_name: cipherai-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: cipherai-api
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

# Note:
# - Ollama is expected to run on the host machine.
# - For Linux Docker, set OLLAMA_BASE_URL=http://host.docker.internal:11434 in .env
